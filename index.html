<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Office World Cup 2026 Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind (warning is safe to ignore) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load Supabase FIRST via ESM, then signal ready -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.48.0";
    window.supabase = { createClient };
    window.dispatchEvent(new Event("supabase-ready"));
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="app-root" class="max-w-6xl mx-auto px-4 py-6">
    <h1 class="text-xl font-bold text-center">Loading app…</h1>
  </div>

  <script>
    window.addEventListener("supabase-ready", () => {
      const SUPABASE_URL = "https://osrnpjckkrwbsvekoqxw.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_uJcuAH0s9c2gKPKaQJyOsg_sFHFcNgf";

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log("Supabase loaded successfully!");

      const root = document.getElementById("app-root");

      root.innerHTML = `
        <div class="space-y-8">
          <!-- HEADER -->
          <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="space-y-1">
              <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                Office World Cup 2026 Predictor
              </h1>
              <p class="text-sm text-slate-400">
                Friendly competition, live scores, and bragging rights — all powered by Supabase.
              </p>
            </div>
            <div class="flex flex-col items-end gap-1">
              <div id="auth-status" class="text-sm text-slate-200">
                Not signed in
              </div>
              <span class="inline-flex items-center gap-1 rounded-full bg-slate-900/70 border border-slate-700 px-3 py-1 text-[11px] uppercase tracking-wide text-slate-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Live Office Pool
              </span>
            </div>
          </header>

          <!-- AUTH SECTION -->
          <section id="auth-section" class="grid md:grid-cols-2 gap-6">
            <!-- Sign up -->
            <div class="bg-gradient-to-br from-slate-900/80 to-slate-950/90 border border-slate-800/80 rounded-2xl p-5 shadow-lg shadow-emerald-500/5 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="font-semibold text-lg">Create your account</h2>
                <span class="text-[10px] px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/40">
                  New player
                </span>
              </div>
              <p class="text-xs text-slate-400">
                Sign up once, then join your office pool with the shared passcode.
              </p>
              <div class="space-y-2">
                <input id="signup-name" type="text" placeholder="Your name"
                       class="w-full px-3 py-2 rounded-lg bg-slate-950/80 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-400" />
                <input id="signup-email" type="email" placeholder="Work email"
                       class="w-full px-3 py-2 rounded-lg bg-slate-950/80 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-400" />
                <input id="signup-password" type="password" placeholder="Password"
                       class="w-full px-3 py-2 rounded-lg bg-slate-950/80 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-400" />
              </div>
              <button id="signup-btn"
                      class="w-full py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-sm font-semibold text-slate-950 shadow-md shadow-emerald-500/30 transition">
                Create account & sign in
              </button>
              <p id="signup-message" class="text-xs text-slate-400 min-h-[1rem]"></p>
            </div>

            <!-- Login -->
            <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-5 shadow-lg shadow-slate-900/60 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="font-semibold text-lg">Welcome back</h2>
                <span class="text-[10px] px-2 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-600">
                  Existing player
                </span>
              </div>
              <p class="text-xs text-slate-400">
                Log in to update your predictions and see how you rank.
              </p>
              <div class="space-y-2">
                <input id="login-email" type="email" placeholder="Email"
                       class="w-full px-3 py-2 rounded-lg bg-slate-950/80 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/60 focus:border-cyan-400" />
                <input id="login-password" type="password" placeholder="Password"
                       class="w-full px-3 py-2 rounded-lg bg-slate-950/80 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/60 focus:border-cyan-400" />
              </div>
              <div class="space-y-2">
                <button id="login-btn"
                        class="w-full py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-sm font-semibold text-slate-950 shadow-md shadow-cyan-500/30 transition">
                  Log in
                </button>
                <button id="logout-btn"
                        class="w-full py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-semibold text-slate-100 hidden">
                  Log out
                </button>
              </div>
              <p id="login-message" class="text-xs text-slate-400 min-h-[1rem]"></p>
            </div>
          </section>

          <!-- PASSCODE -->
          <section id="passcode-section" class="hidden bg-slate-950/90 border border-slate-800 rounded-2xl p-5 shadow-inner shadow-slate-900/80 space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="font-semibold text-lg">Join your office pool</h2>
                <p class="text-xs text-slate-400">
                  Your organizer shared a passcode. Enter it once to unlock the game.
                </p>
              </div>
              <span class="text-[10px] px-2 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/40">
                Required
              </span>
            </div>
            <div class="flex flex-col md:flex-row gap-2 items-stretch md:items-center">
              <input id="passcode-input" type="text" placeholder="Office passcode"
                     class="flex-1 px-3 py-2 rounded-lg bg-slate-950/80 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/60 focus:border-amber-400 tracking-[0.2em] uppercase" />
              <button id="passcode-btn"
                      class="px-4 py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-sm font-semibold text-slate-950 shadow-md shadow-amber-500/30 transition">
                Join with passcode
              </button>
            </div>
            <p id="passcode-message" class="text-xs text-slate-400 min-h-[1rem]"></p>
          </section>

          <!-- MAIN APP -->
          <section id="app-section" class="hidden space-y-6">
            <!-- Tabs -->
            <div class="flex flex-wrap gap-2 text-sm">
              <button data-tab="matches"
                      class="tab-btn px-4 py-2 rounded-full bg-slate-800 border border-slate-700 text-slate-50 shadow-sm shadow-slate-900/60">
                Matches & Predictions
              </button>
              <button data-tab="leaderboard"
                      class="tab-btn px-4 py-2 rounded-full bg-slate-950 border border-slate-800 text-slate-300 hover:bg-slate-900 transition">
                Leaderboard
              </button>
              <button data-tab="admin"
                      class="tab-btn px-4 py-2 rounded-full bg-slate-950 border border-slate-800 text-slate-300 hover:bg-slate-900 transition hidden"
                      id="admin-tab-btn">
                Admin
              </button>
            </div>

            <!-- Matches tab -->
            <div id="tab-matches" class="space-y-4">
              <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
                <h2 class="font-semibold text-lg flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  World Cup 2026 Matches
                </h2>
                <p class="text-[11px] text-slate-400">
                  Click Home / Draw / Away to lock in your prediction.
                </p>
              </div>
              <div id="matches-list" class="space-y-3 text-sm"></div>
            </div>

            <!-- Leaderboard tab -->
            <div id="tab-leaderboard" class="hidden space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="font-semibold text-lg">Leaderboard</h2>
                <p class="text-[11px] text-slate-400">
                  3 points for each correct result.
                </p>
              </div>
              <div id="leaderboard-list" class="space-y-2 text-sm"></div>
            </div>

            <!-- Admin tab -->
            <div id="tab-admin" class="hidden space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="font-semibold text-lg">Admin panel</h2>
                <span class="text-[10px] px-2 py-1 rounded-full bg-fuchsia-500/10 text-fuchsia-300 border border-fuchsia-500/40">
                  Organizer only
                </span>
              </div>
              <p class="text-xs text-slate-400">
                Insert a couple of sample World Cup matches into <code class="text-[10px] bg-slate-900 px-1.5 py-0.5 rounded border border-slate-700">MATCHES</code>.
              </p>
              <button id="admin-sync-matches"
                      class="px-4 py-2.5 rounded-lg bg-fuchsia-500 hover:bg-fuchsia-400 text-sm font-semibold text-slate-950 shadow-md shadow-fuchsia-500/30 transition">
                Insert sample World Cup matches
              </button>
              <p id="admin-message" class="text-xs text-slate-400 min-h-[1rem]"></p>
            </div>
          </section>
        </div>
      `;

      // Element refs
      const authStatusEl = document.getElementById("auth-status");
      const signupNameEl = document.getElementById("signup-name");
      const signupEmailEl = document.getElementById("signup-email");
      const signupPasswordEl = document.getElementById("signup-password");
      const signupBtn = document.getElementById("signup-btn");
      const signupMsg = document.getElementById("signup-message");

      const loginEmailEl = document.getElementById("login-email");
      const loginPasswordEl = document.getElementById("login-password");
      const loginBtn = document.getElementById("login-btn");
      const logoutBtn = document.getElementById("logout-btn");
      const loginMsg = document.getElementById("login-message");

      const passcodeSection = document.getElementById("passcode-section");
      const passcodeInput = document.getElementById("passcode-input");
      const passcodeBtn = document.getElementById("passcode-btn");
      const passcodeMsg = document.getElementById("passcode-message");

      const appSection = document.getElementById("app-section");
      const matchesTab = document.getElementById("tab-matches");
      const leaderboardTab = document.getElementById("tab-leaderboard");
      const adminTab = document.getElementById("tab-admin");
      const adminTabBtn = document.getElementById("admin-tab-btn");
      const matchesList = document.getElementById("matches-list");
      const leaderboardList = document.getElementById("leaderboard-list");
      const adminSyncBtn = document.getElementById("admin-sync-matches");
      const adminMsg = document.getElementById("admin-message");
      const tabButtons = document.querySelectorAll(".tab-btn");

      let currentUser = null;
      let currentProfile = null;

      function setAuthStatus(text) {
        authStatusEl.textContent = text;
      }

      function showSectionAfterAuth() {
        if (!currentUser) {
          passcodeSection.classList.add("hidden");
          appSection.classList.add("hidden");
          return;
        }
        passcodeSection.classList.remove("hidden");
        if (currentProfile && currentProfile.joined_with_passcode) {
          appSection.classList.remove("hidden");
        }
      }

      function setActiveTab(tabName) {
        const tabs = { matches: matchesTab, leaderboard: leaderboardTab, admin: adminTab };
        Object.keys(tabs).forEach(name => {
          if (name === tabName) tabs[name].classList.remove("hidden");
          else tabs[name].classList.add("hidden");
        });
        tabButtons.forEach(btn => {
          const t = btn.getAttribute("data-tab");
          if (t === tabName) {
            btn.classList.remove("bg-slate-950", "border-slate-800", "text-slate-300");
            btn.classList.add("bg-slate-800", "border-slate-700", "text-slate-50", "shadow-sm", "shadow-slate-900/60");
          } else {
            btn.classList.add("bg-slate-950", "border-slate-800", "text-slate-300");
            btn.classList.remove("bg-slate-800", "border-slate-700", "text-slate-50", "shadow-sm", "shadow-slate-900/60");
          }
        });
      }

      tabButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          const tab = btn.getAttribute("data-tab");
          setActiveTab(tab);
          if (tab === "leaderboard") loadLeaderboard();
        });
      });

      async function loadProfile() {
        if (!currentUser) return;
        const { data, error } = await supabase
          .from("users")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();
        if (error) {
          console.error("loadProfile error", error);
          return;
        }
        currentProfile = data;
        if (currentProfile && currentProfile.is_admin) {
          adminTabBtn.classList.remove("hidden");
        } else {
          adminTabBtn.classList.add("hidden");
        }
        showSectionAfterAuth();
      }

      async function ensureUserRow(name) {
        if (!currentUser) return;
        const { data, error } = await supabase
          .from("users")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();
        if (error) {
          console.error("ensureUserRow select error", error);
          return;
        }
        if (!data) {
          const { error: insertError } = await supabase.from("users").insert({
            id: currentUser.id,
            email: currentUser.email,
            name: name || currentUser.email,
            joined_with_passcode: false,
            is_admin: false
          });
          if (insertError) console.error("ensureUserRow insert error", insertError);
        }
      }

      async function loadMatches() {
        if (!currentUser) {
          matchesList.innerHTML = `<p class="text-xs text-slate-400">Log in to see matches.</p>`;
          return;
        }
        const { data, error } = await supabase
          .from("matches")
          .select("*")
          .order("kickoff_time", { ascending: true });
        if (error) {
          console.error("loadMatches error", error);
          matchesList.innerHTML = `<p class="text-xs text-red-400">Failed to load matches.</p>`;
          return;
        }
        if (!data || data.length === 0) {
          matchesList.innerHTML = `<p class="text-xs text-slate-400">No matches yet. Admin can insert sample matches.</p>`;
          return;
        }

        let html = "";
        for (const m of data) {
          const { data: predData } = await supabase
            .from("predictions")
            .select("*")
            .eq("user_id", currentUser.id)
            .eq("match_id", m.id)
            .maybeSingle();
          const userPrediction = predData ? predData.prediction : null;

          const statusBadge = m.status === "finished"
            ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/40">Final</span>`
            : `<span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-600">${m.status || "Scheduled"}</span>`;

          html += `
            <div class="border border-slate-800/80 rounded-2xl bg-slate-950/80 p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3 shadow-sm shadow-slate-900/70">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <div class="font-semibold text-sm">
                    ${m.home_team} <span class="text-slate-500 text-[11px]">vs</span> ${m.away_team}
                  </div>
                  ${statusBadge}
                </div>
                <div class="text-[11px] text-slate-400">
                  ${m.competition || "World Cup 2026"} •
                  ${m.kickoff_time ? new Date(m.kickoff_time).toLocaleString() : ""}
                </div>
                ${m.status === "finished"
                  ? `<div class="text-[11px] text-emerald-400 mt-1">Final score: ${m.home_score} - ${m.away_score}</div>`
                  : ""
                }
              </div>
              <div class="flex items-center gap-2 text-xs">
                <button data-match="${m.id}" data-choice="home"
                        class="predict-btn px-3 py-1.5 rounded-full border text-[11px] transition
                               ${userPrediction === "home"
                                  ? "bg-emerald-500 text-slate-950 border-emerald-400 shadow shadow-emerald-500/40"
                                  : "bg-slate-900 border-slate-700 hover:border-emerald-400/70 hover:bg-slate-900/80"}">
                  Home
                </button>
                <button data-match="${m.id}" data-choice="draw"
                        class="predict-btn px-3 py-1.5 rounded-full border text-[11px] transition
                               ${userPrediction === "draw"
                                  ? "bg-emerald-500 text-slate-950 border-emerald-400 shadow shadow-emerald-500/40"
                                  : "bg-slate-900 border-slate-700 hover:border-emerald-400/70 hover:bg-slate-900/80"}">
                  Draw
                </button>
                <button data-match="${m.id}" data-choice="away"
                        class="predict-btn px-3 py-1.5 rounded-full border text-[11px] transition
                               ${userPrediction === "away"
                                  ? "bg-emerald-500 text-slate-950 border-emerald-400 shadow shadow-emerald-500/40"
                                  : "bg-slate-900 border-slate-700 hover:border-emerald-400/70 hover:bg-slate-900/80"}">
                  Away
                </button>
              </div>
            </div>
          `;
        }
        matchesList.innerHTML = html;

        document.querySelectorAll(".predict-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const matchId = Number(btn.getAttribute("data-match"));
            const choice = btn.getAttribute("data-choice");
            await savePrediction(matchId, choice);
            await loadMatches();
          });
        });
      }

      async function savePrediction(matchId, prediction) {
        if (!currentUser) return;
        const { error } = await supabase.from("predictions").upsert({
          user_id: currentUser.id,
          match_id: matchId,
          prediction
        });
        if (error) {
          console.error("savePrediction error", error);
          alert("Failed to save prediction.");
        }
      }

      async function loadLeaderboard() {
        const { data, error } = await supabase
          .from("leaderboard")
          .select("*")
          .order("points", { ascending: false });
        if (error) {
          console.error("loadLeaderboard error", error);
          leaderboardList.innerHTML = `<p class="text-xs text-red-400">Failed to load leaderboard.</p>`;
          return;
        }
        if (!data || data.length === 0) {
          leaderboardList.innerHTML = `<p class="text-xs text-slate-400">No points yet. Make some predictions!</p>`;
          return;
        }
        let html = "";
        data.forEach((row, idx) => {
          const isTop = idx === 0;
          html += `
            <div class="flex items-center justify-between border rounded-2xl px-3 py-2
                        ${isTop
                          ? "border-amber-400/70 bg-amber-500/10 shadow shadow-amber-500/30"
                          : "border-slate-800 bg-slate-950/80"}">
              <div class="flex items-center gap-2">
                <span class="text-[11px] px-2 py-0.5 rounded-full
                             ${isTop
                               ? "bg-amber-500 text-slate-950 font-semibold"
                               : "bg-slate-800 text-slate-300"}">
                  #${idx + 1}
                </span>
                <span class="text-sm font-medium">${row.name || "Unnamed"}</span>
              </div>
              <div class="text-xs font-semibold ${isTop ? "text-amber-300" : "text-emerald-400"}">
                ${row.points} pts
              </div>
            </div>
          `;
        });
        leaderboardList.innerHTML = html;
      }

      async function insertSampleMatches() {
        adminMsg.textContent = "Inserting sample matches...";
        const now = new Date();
        const sample = [
          {
            ext_id: "wc2026-1",
            comp: "World Cup 2026",
            home: "Canada",
            away: "Mexico",
            kickoff: new Date(now.getTime() + 24 * 60 * 60 * 1000).toISOString(),
            status: "scheduled",
            hscore: null,
            ascore: null
          },
          {
            ext_id: "wc2026-2",
            comp: "World Cup 2026",
            home: "USA",
            away: "Brazil",
            kickoff: new Date(now.getTime() + 48 * 60 * 60 * 1000).toISOString(),
            status: "scheduled",
            hscore: null,
            ascore: null
          }
        ];

        for (const m of sample) {
          const { error } = await supabase.rpc("sync_match", {
            ext_id: m.ext_id,
            comp: m.comp,
            home: m.home,
            away: m.away,
            kickoff: m.kickoff,
            status: m.status,
            hscore: m.hscore,
            ascore: m.ascore
          });
          if (error) {
            console.error("sync_match error", error);
            adminMsg.textContent = "Error inserting sample matches.";
            return;
          }
        }
        adminMsg.textContent = "Sample matches inserted.";
        await loadMatches();
      }

      adminSyncBtn.addEventListener("click", insertSampleMatches);

      // Auth handlers
      signupBtn.addEventListener("click", async () => {
        signupMsg.textContent = "";
        const name = signupNameEl.value.trim();
        const email = signupEmailEl.value.trim();
        const password = signupPasswordEl.value.trim();
        if (!name || !email || !password) {
          signupMsg.textContent = "Please fill all fields.";
          return;
        }
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          console.error("signUp error", error);
          signupMsg.textContent = "Signup failed: " + error.message;
          return;
        }
        currentUser = data.user;
        setAuthStatus(`Signed in as ${email}`);
        signupMsg.textContent = "Account created and signed in.";
        await ensureUserRow(name);
        await loadProfile();
        await loadMatches();
        logoutBtn.classList.remove("hidden");
      });

      loginBtn.addEventListener("click", async () => {
        loginMsg.textContent = "";
        const email = loginEmailEl.value.trim();
        const password = loginPasswordEl.value.trim();
        if (!email || !password) {
          loginMsg.textContent = "Please enter email and password.";
          return;
        }
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          console.error("login error", error);
          loginMsg.textContent = "Login failed: " + error.message;
          return;
        }
        currentUser = data.user;
        setAuthStatus(`Signed in as ${email}`);
        loginMsg.textContent = "Logged in.";
        await ensureUserRow();
        await loadProfile();
        await loadMatches();
        logoutBtn.classList.remove("hidden");
      });

      logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        currentUser = null;
        currentProfile = null;
        setAuthStatus("Not signed in");
        appSection.classList.add("hidden");
        passcodeSection.classList.add("hidden");
        logoutBtn.classList.add("hidden");
      });

      passcodeBtn.addEventListener("click", async () => {
        passcodeMsg.textContent = "";
        const code = passcodeInput.value.trim();
        if (!code) {
          passcodeMsg.textContent = "Enter a passcode.";
          return;
        }
        const { data, error } = await supabase
          .from("office_settings")
          .select("*")
          .eq("id", 1)
          .maybeSingle();
        if (error) {
          console.error("passcode check error", error);
          passcodeMsg.textContent = "Error checking passcode.";
          return;
        }
        if (!data || data.join_passcode !== code) {
          passcodeMsg.textContent = "Invalid passcode.";
          return;
        }
        const { error: updError } = await supabase
          .from("users")
          .update({ joined_with_passcode: true })
          .eq("id", currentUser.id);
        if (updError) {
          console.error("update joined_with_passcode error", updError);
          passcodeMsg.textContent = "Failed to join.";
          return;
        }
        passcodeMsg.textContent = "You joined the office pool!";
        await loadProfile();
        await loadMatches();
      });

      // Initial session
      (async () => {
        const { data: sessionData } = await supabase.auth.getSession();
        if (sessionData && sessionData.session && sessionData.session.user) {
          currentUser = sessionData.session.user;
          setAuthStatus(`Signed in as ${currentUser.email}`);
          logoutBtn.classList.remove("hidden");
          await ensureUserRow();
          await loadProfile();
          await loadMatches();
        } else {
          setAuthStatus("Not signed in");
        }
        setActiveTab("matches");
      })();
    });
  </script>
</body>
</html>
