<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Supabase Load Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind (safe to ignore warning) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load Supabase FIRST -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.48.0";

    // Expose globally
    window.supabase = { createClient };

    // Signal ready
    window.dispatchEvent(new Event("supabase-ready"));
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">

  <div id="app" class="text-center">
    <h1 class="text-xl font-bold">Loading Supabase…</h1>
  </div>

  <!-- MAIN APP SCRIPT (runs ONLY after Supabase loads) -->
  <script>
    window.addEventListener("supabase-ready", () => {
      console.log("Supabase loaded!");

      const SUPABASE_URL = "https://osrnpjckkrwbsvekoqxw.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_uJcuAH0s9c2gKPKaQJyOsg_sFHFcNgf";

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document.getElementById("app").innerHTML = `
        <div class="space-y-4">
          <h1 class="text-2xl font-bold text-emerald-400">Supabase Loaded Successfully 🎉</h1>
          <p class="text-slate-300">window.supabase is now defined.</p>
          <p class="text-slate-400 text-sm">Next: I will paste the full app UI once you confirm this works.</p>
        </div>
      `;
    });
  </script>

</body>
</html>
