<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Office World Cup Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind (warning is normal, safe to ignore) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase ESM import (this FIXES window.supabase undefined) -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.48.0";
    window.supabase = { createClient };
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-6 space-y-6">
    <header class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">Office World Cup 2026 Predictor</h1>
        <p class="text-sm text-slate-400">Powered by Supabase & Groq</p>
      </div>
      <div id="auth-status" class="text-right text-sm text-slate-300">
        Not signed in
      </div>
    </header>

    <!-- AUTH SECTION -->
    <section id="auth-section" class="grid md:grid-cols-2 gap-6">
      <!-- SIGNUP -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4 space-y-3">
        <h2 class="font-semibold text-lg">Sign up</h2>
        <input id="signup-name" type="text" placeholder="Your name"
               class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
        <input id="signup-email" type="email" placeholder="Email"
               class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
        <input id="signup-password" type="password" placeholder="Password"
               class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
        <button id="signup-btn"
                class="w-full py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-sm font-medium">
          Create account
        </button>
        <p id="signup-message" class="text-xs text-slate-400"></p>
      </div>

      <!-- LOGIN -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4 space-y-3">
        <h2 class="font-semibold text-lg">Log in</h2>
        <input id="login-email" type="email" placeholder="Email"
               class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
        <input id="login-password" type="password" placeholder="Password"
               class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
        <button id="login-btn"
                class="w-full py-2 rounded bg-blue-600 hover:bg-blue-500 text-sm font-medium">
          Log in
        </button>
        <button id="logout-btn"
                class="w-full py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm font-medium hidden mt-1">
          Log out
        </button>
        <p id="login-message" class="text-xs text-slate-400"></p>
      </div>
    </section>

    <!-- PASSCODE -->
    <section id="passcode-section" class="hidden bg-slate-900/60 border border-slate-800 rounded-lg p-4 space-y-3">
      <h2 class="font-semibold text-lg">Join your office pool</h2>
      <input id="passcode-input" type="text" placeholder="Office passcode"
             class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
      <button id="passcode-btn"
              class="px-4 py-2 rounded bg-amber-600 hover:bg-amber-500 text-sm font-medium">
        Join with passcode
      </button>
      <p id="passcode-message" class="text-xs text-slate-400"></p>
    </section>

    <!-- APP -->
    <section id="app-section" class="hidden space-y-6">
      <div class="flex gap-2 text-sm">
        <button data-tab="matches"
                class="tab-btn px-3 py-1 rounded bg-slate-800 border border-slate-700">
          Matches
        </button>
        <button data-tab="leaderboard"
                class="tab-btn px-3 py-1 rounded bg-slate-900 border border-slate-800">
          Leaderboard
        </button>
        <button data-tab="admin"
                id="admin-tab-btn"
                class="tab-btn px-3 py-1 rounded bg-slate-900 border border-slate-800 hidden">
          Admin
        </button>
      </div>

      <!-- MATCHES -->
      <div id="tab-matches" class="space-y-4">
        <h2 class="font-semibold text-lg">World Cup 2026 Matches</h2>
        <div id="matches-list" class="space-y-3 text-sm"></div>
      </div>

      <!-- LEADERBOARD -->
      <div id="tab-leaderboard" class="hidden space-y-4">
        <h2 class="font-semibold text-lg">Leaderboard</h2>
        <div id="leaderboard-list" class="space-y-2 text-sm"></div>
      </div>

      <!-- ADMIN -->
      <div id="tab-admin" class="hidden space-y-4">
        <h2 class="font-semibold text-lg">Admin</h2>
        <button id="admin-sync-matches"
                class="px-4 py-2 rounded bg-purple-600 hover:bg-purple-500 text-sm font-medium">
          Insert sample matches
        </button>
        <p id="admin-message" class="text-xs text-slate-400"></p>
      </div>
    </section>
  </div>

  <!-- MAIN APP SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const SUPABASE_URL = "https://osrnpjckkrwbsvekoqxw.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_uJcuAH0s9c2gKPKaQJyOsg_sFHFcNgf";

      if (!window.supabase || !window.supabase.createClient) {
        console.error("Supabase ESM failed to load.");
        alert("Supabase failed to load. Check your internet or CDN.");
        return;
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      /* -------------------------
         ALL YOUR EXISTING JS HERE
         (auth, passcode, matches, leaderboard, admin)
         ------------------------- */

      console.log("Supabase loaded successfully!");
    });
  </script>
</body>
</html>
